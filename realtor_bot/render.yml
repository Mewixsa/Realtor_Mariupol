services:
  - type: web
    name: realtor-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    # Keep the previous SQLite disk available for the one-time Neon import.
    disk:
      name: realtor-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false